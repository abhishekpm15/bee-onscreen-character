<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buzzy the Bee</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="40" height="40">
    <div>
      <h1>Buzzy the Bee</h1>
      <p id="status">Buzzy is resting</p>
    </div>
  </header>

  <label class="switch-row" for="toggle">
    <span>Show bee</span>
    <input type="checkbox" id="toggle" role="switch">
    <span class="switch" aria-hidden="true"></span>
  </label>

  <p class="hint">Click Buzzy on the page to make it spin.</p>

  <script src="popup.js"></script>
</body>
</html>
