<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buzzy the Bee</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="40" height="40">
    <div>
      <h1>Buzzy the Bee</h1>
      <p id="status">Buzzy is resting</p>
    </div>
  </header>

  <label class="switch-row" for="toggle">
    <span>Show bee</span>
    <input type="checkbox" id="toggle" role="switch">
    <span class="switch" aria-hidden="true"></span>
  </label>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-style" aria-controls="panel-style" aria-selected="true">Style</button>
    <button type="button" role="tab" id="tab-chat" aria-controls="panel-chat" aria-selected="false">
      Chat <span id="tab-dot" class="tab-dot" hidden></span>
    </button>
  </nav>

  <section id="panel-style" role="tabpanel" aria-labelledby="tab-style">
    <div class="preview"><div class="preview-bee" id="preview"></div></div>

    <h2>Skins</h2>
    <div class="presets" id="presets"></div>

    <h2>Colors</h2>
    <div class="colors" id="colors"></div>

    <h2>Accessories</h2>
    <div class="parts" id="parts"></div>

    <button type="button" id="reset" class="link">Reset to classic</button>
  </section>

  <section id="panel-chat" role="tabpanel" aria-labelledby="tab-chat" hidden>
    <div class="chat-head">
      <span id="conn" class="conn"><span class="dot"></span><span id="conn-text">Not set up</span></span>
    </div>

    <form id="settings">
      <label>Your name
        <input id="name" maxlength="40" placeholder="e.g. Sam" required>
      </label>
      <label>Room code
        <span class="row">
          <input id="room" maxlength="64" placeholder="Share this with your friend" required>
          <button type="button" id="gen" title="Make a new random code">New</button>
        </span>
      </label>
      <button type="submit" id="save">Save &amp; connect</button>
    </form>
    <p class="hint">Your friend enters the same room code to chat with you.</p>
  </section>

  <script src="bee-art.js"></script>
  <script src="popup.js"></script>
</body>
</html>
